<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HyprPixl - Bringing Your Ideas to Life</title>
    <link rel="icon" type="image/png" href="images/Logo.png">

    <style>
       @keyframes rotate {
            0% {
                transform: rotate(0deg);
            }
            100% {
                transform: rotate(360deg);
            }
        }

        .animated-background {
            position: absolute;
            inset: 0;
            display: flex;
            place-content: center;
            align-items: center;
            overflow: hidden;
            z-index: -1;
        }

        .gradient {
            --size: 250px;
            --speed: 15s;
            --easing: cubic-bezier(0.8, 0.2, 0.2, 0.8);

            width: var(--size);
            height: var(--size);
            filter: blur(calc(var(--size) / 5));
            background-image: linear-gradient(hsla(0, 100%, 18%, 0.85), hsl(52, 99%, 35%));
            animation: rotate var(--speed) var(--easing) alternate infinite;
            border-radius: 30% 70% 70% 30% / 30% 30% 70% 70%;
        }

        @media (min-width: 720px) {
            .gradient {
                --size: 500px;
            }
        }

        body {
            background-color: #222;
            font-family: Arial, sans-serif;
            color: #e0e0e0;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow: hidden;
            height: 100vh;
            margin: 0;
            padding: 0;
        }

        * {
            transition: all 0.25s ease-out;
            box-sizing: border-box;
        }

        .top-message {
            position: absolute;
            top: 50px; /* Adjust as needed */
            left: 50%;
            transform: translateX(-50%);
            background-color: rgba(0, 0, 0, 0.6);
            color: #ffffff;
            padding: 15px 30px;
            border-radius: 15px;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.3);
            z-index: 20;
            max-width: 90%;
            text-align: center;
            font-size: 1.2em;
            font-weight: bold;
            border: 2px solid #ffffff;
        }

        /* Glassy box for the logo */
        .logo-box {
            width: 150px;
            padding: 20px;
            background-color: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.2);
            display: flex;
            justify-content: center;
            align-items: center;
            margin-top: 100px; /* Adjust as needed */
            z-index: 10;
        }

        .logo {
            width: 100%;
            height: auto;
        }

        .glassy-box {
            width: 80%;
            max-width: 600px;
            padding: 30px;
            margin-top: 30px; /* Adjust as needed */
            background-color: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.2);
            text-align: center;
            transition: box-shadow 0.3s;
            z-index: 10;
        }

        .glassy-box:hover {
            box-shadow: 0 0 30px rgba(255, 255, 235, 0.9);
        }

        .headline {
            font-size: 2em;
            margin-bottom: 10px;
            color: #ffffff;
        }

        .subheadline {
            font-size: 1.2em;
            margin-bottom: 30px;
            color: #cccccc;
        }

        .cta-button {
            display: inline-block;
            padding: 15px 30px;
            background-color: #ffcc00;
            color: #000000;
            font-size: 1em;
            font-weight: bold;
            text-decoration: none;
            border-radius: 10px;
            margin-bottom: 30px;
        }

        .cta-button:hover {
            background-color: #e6b800;
        }

        .contact-info {
            color: #ffffff;
            font-size: 1em;
        }

        .contact-info p {
            margin: 5px 0;
        }

        .contact-info a {
            color: #ffcc00;
            text-decoration: none;
        }

        .contact-info a:hover {
            text-decoration: underline;
        }

        /* Remove blue underline from email and links */
        a {
            text-decoration: none;
            color: inherit;
        }

        a:hover {
            color: #ffcc00;
        }

        /* Responsive adjustments */
        @media (max-width: 480px) {
            .headline {
                font-size: 1.5em;
            }

            .subheadline {
                font-size: 1em;
            }

            .cta-button {
                padding: 10px 20px;
                font-size: 0.9em;
            }

            .contact-info {
                font-size: 0.9em;
            }

            .logo-box {
                width: 120px;
                padding: 15px;
                margin-top: 80px;
            }
        }

    </style>
</head>
<body>

    <div class="animated-background">
        <div class="gradient"></div>
    </div>

    <!-- Top message indicating limited openings -->
    <div class="top-message">
        Currently have space for 4 hours/week to work on <strong>YOUR</strong> idea!
    </div>

    <!-- Glassy box for the logo -->
    <div class="logo-box">
        <img src="images/Logo.png" alt="Logo" class="logo">
    </div>

    <!-- Main content glassy box -->
    <div class="glassy-box">
        <h1 class="headline">Bringing Your Ideas to Life</h1>
        <p class="subheadline">Expert digital solutions tailored just for you.</p>
        <a href="#contact" class="cta-button">Get Started</a>

        <div class="contact-info" id="contact">
            <p><strong>Contact Information</strong></p>
            <p>Email: <a href="mailto:HyprPixlStudios@gmail.com">HyprPixlStudios@gmail.com</a></p>
            <p>Instagram: <a href="https://www.instagram.com/hyprpixlstudios/" target="_blank">@hyprpixlstudios</a></p>
            <p>LinkedIn: <a href="https://www.linkedin.com/company/hyprpixl/" target="_blank">HyprPixl</a></p>
        </div>
    </div>

</body>
</html>
