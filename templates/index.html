<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HyprPixl - Landing Page</title>
    <style>
        @keyframes rotate {
            0% {
                transform: rotate(0deg);
            }
            100% {
                transform: rotate(360deg);
            }
        }

        .animated-background {
            position: absolute;
            inset: 0;
            display: flex;
            place-content: center;
            align-items: center;
            overflow: hidden;
        }

        .gradient {
            --size: 250px;
            --speed: 50s;
            --easing: cubic-bezier(0.8, 0.2, 0.2, 0.8);

            width: var(--size);
            height: var(--size);
            filter: blur(calc(var(--size) / 5));
            background-image: linear-gradient(hsl(158, 82%, 57%, 85%), hsl(252, 82%, 57%));
            animation: rotate var(--speed) var(--easing) alternate infinite;
            border-radius: 30% 70% 70% 30% / 30% 30% 70% 70%;
        }

        @media (min-width: 720px) {
            .gradient {
                --size: 500px;
            }
        }

        body {
            background-color: #222;
            font-family: Arial, sans-serif;
            color: #e0e0e0;
            display: flex;
            place-content: center;
            align-items: center;
            overflow: hidden;
            height: 100vh; /* Ensure the body takes up the full height of the viewport */
            margin: 0;
        }

        /* This is just to transition when you change the viewport size. */
        * {
            transition: all 0.25s ease-out;
        }

        .glassy-box {
            width: 300px;
            padding: 20px;
            background-color: rgba(255, 255, 255, 0.5); /* Adjust the transparency here */
            backdrop-filter: blur(10px);
            border-radius: 20px;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.1);
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            cursor: pointer;
            transition: box-shadow 0.3s;
        }

        .glassy-box:hover {
            box-shadow: 0 0 30px rgba(255, 255, 255, 0.3);
        }

        .logo {
            width: 100px;
            height: auto;
            margin-bottom: 20px;
        }

        .contact-info {
            color: #fff;
        }

        .contact-info p {
            margin: 5px 0;
        }

        .contact-info a {
            color: #fff;
            text-decoration: underline;
        }
    </style>
</head>
<body>

<div class="animated-background">
    <div class="gradient"></div>
</div>

<div class="glassy-box">
    <a href="https://www.linkedin.com/company/hyprpixl/" target="_blank" rel="noopener noreferrer">
        <img src="{{ url_for('static', filename='images/Logo.png') }}" alt="Logo" class="logo">
        <div class="contact-info">
            <p>Contact Information</p>
            <p>Email: contact@hyprpixl.com</p>
            <p>Phone: 123-456-7890</p>
        </div>
    </a>
</div>

</body>
</html>
